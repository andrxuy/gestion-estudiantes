spring.application.name=gestion-estudiantes

# Active profile: "dev" for development, "prod" for production
spring.profiles.active=dev

# H2
spring.datasource.url=jdbc:h2:mem:estudiantes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console   # ← CAMBIA ESTA LÍNEA

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Debug logging para seguimiento de peticiones
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE